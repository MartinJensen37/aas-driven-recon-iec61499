# The evaluation (eval) and the AAS stack: BaSyx (AAS environment, registries, discovery), the web UI
# with the skill editor and the Process Sequence module, the skill service it asks for matching,
# planning and checking, and a one-shot job that publishes the use case's AASs.
#
#   docker compose run --rm eval python eval/q4.py     # a test (see README.md)
#   docker compose up -d                               # the web UI on http://localhost:3000
name: aas-recon

x-basyx: &basyx
  BASYX_CORS_ALLOWED_ORIGINS: "*"
  BASYX_CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD

services:
  eval:
    build: .
    image: aas-recon:1.0
    profiles: [eval]
    volumes:
      - ./eval/results:/repo/eval/results

  aas-registry:
    image: eclipsebasyx/aas-registry-log-mem:2.0.0-milestone-16
    ports: ["8082:8080"]
    environment:
      <<: *basyx
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/shell-descriptors"]
      interval: 3s
      retries: 30

  sm-registry:
    image: eclipsebasyx/submodel-registry-log-mem:2.0.0-milestone-16
    ports: ["8083:8080"]
    environment:
      <<: *basyx
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXT_PATH: /
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/submodel-descriptors"]
      interval: 3s
      retries: 30

  aas-discovery:
    image: eclipsebasyx/aas-discovery:2.0.0-milestone-16
    ports: ["8084:8081"]
    environment:
      <<: *basyx
      SERVER_PORT: 8081
      BASYX_BACKEND: InMemory
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/lookup/shells"]
      interval: 3s
      retries: 30

  aas-environment:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-16
    ports: ["8081:8081"]
    environment:
      <<: *basyx
      SERVER_PORT: 8081
      BASYX_BACKEND: InMemory
      BASYX_AASREPOSITORY_FEATURE_DISCOVERYINTEGRATION: http://aas-discovery:8081
      BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION: http://aas-registry:8080
      BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION: http://sm-registry:8080
      BASYX_EXTERNALURL: http://localhost:8081
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/shells"]
      interval: 3s
      retries: 40
    depends_on:
      aas-registry: {condition: service_healthy}
      sm-registry: {condition: service_healthy}
      aas-discovery: {condition: service_healthy}

  # The filling module's, its components' and the products' AASs, sent to the AAS environment once.
  publish:
    image: aas-recon:1.0
    build: .
    command: python aas/build.py --publish http://aas-environment:8081
    depends_on:
      aas-environment: {condition: service_healthy}

  # Matching, planning and checking for the web UI (modreg.service), on the AASs in the environment.
  skill-service:
    image: aas-recon:1.0
    build: .
    command: modreg serve --basyx http://aas-environment:8081
    ports: ["8090:8090"]
    depends_on:
      aas-environment: {condition: service_healthy}

  web-ui:
    image: aas-recon-web-ui:1.0
    build:
      context: ./web-ui/aas-web-ui
      dockerfile: ../examples/ProcessSequence/Dockerfile
    ports: ["3000:3000"]
    environment:
      AAS_REGISTRY_PATH: http://localhost:8082/shell-descriptors
      SUBMODEL_REGISTRY_PATH: http://localhost:8083/submodel-descriptors
      AAS_REPO_PATH: http://localhost:8081/shells
      SUBMODEL_REPO_PATH: http://localhost:8081/submodels
      CD_REPO_PATH: http://localhost:8081/concept-descriptions
      AAS_DISCOVERY_PATH: http://localhost:8084/lookup/shells
    depends_on: [aas-environment]
